<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมจัดช่องสินค้า</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#241f33;--mut:#6b6580;--line:#d9d3e8;--acc:#e4002b;--acc2:#7a3cff;
--c0:#f3d6f5;--c1:#d3ecfb;--c2:#fff0c9;--c3:#dff3d3;--c4:#e9d7c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2d;--ink:#f1eef8;--mut:#a39cb8;--line:#3a3450;--c0:#4a2d4f;--c1:#223e50;--c2:#4f4425;--c3:#2f4727;--c4:#4b3a2e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;padding:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tot{font-size:13px;color:var(--mut)}.tot b{display:block;font-size:24px;color:var(--acc)}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.cell{min-height:150px;padding:5px}.slot{min-height:58px}.slot img{max-height:42px}.slot .nm{font-size:9px}.slot .pr{font-size:9px}.sum{font-size:12px}body{padding:8px}.q button{padding:0 6px}}
.who{display:flex;gap:8px;margin-bottom:10px}.who input{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
body.cap .x,body.cap .q button,body.cap .slot.empty,body.cap #reset,body.cap .sub,body.cap .no span:last-child{display:none}body.cap .q b::before{content:"× "}body.cap .bar{position:static}body.cap .cell{cursor:default}
.cell{border-radius:14px;border:2px solid var(--line);padding:8px;min-height:230px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s}
.cell:hover{border-color:var(--acc2)}
.cell .no{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.slot{background:var(--card);border-radius:10px;border:1px dashed var(--line);flex:1;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;position:relative;text-align:center}
.slot.empty{color:var(--mut);font-size:13px}
.slot img{max-width:100%;max-height:62px;object-fit:contain}
.slot .nm{font-size:11px;line-height:1.2;margin-top:2px}
.slot .pr{font-size:11px;color:var(--mut)}
.q{display:flex;gap:4px;align-items:center;margin-top:3px}
.q button{padding:0 8px;line-height:20px;font-size:14px;border-radius:6px}
.x{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px;border-radius:50%;font-size:12px}
.sum{font-weight:700;text-align:right;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--bg);width:min(900px,100%);max-height:88vh;border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:8px 0}
.list{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.it:hover{border-color:var(--acc)}
.it img{height:70px;max-width:100%;object-fit:contain}
.ph{height:70px;display:flex;align-items:center;justify-content:center;font-size:30px}
.it .nm{font-size:12px;line-height:1.25;min-height:30px}.it .pr{font-weight:700;color:var(--acc);font-size:13px}
.msg{font-size:12px;color:var(--mut)}
</style></head><body>
<h1>🍦 เกมจัดช่องสินค้า</h1>
<div class="sub">แตะที่ช่องเพื่อเพิ่มสินค้า (ช่องละไม่เกิน 2 รายการ) · ราคาคิดเป็นต่อลัง</div>
<div class="who"><input id="nm" placeholder="ชื่อเซลล์แมน"><input id="ct" placeholder="ศูนย์จัดจำหน่าย"></div>
<div class="bar">
  <div class="tot">ยอดรวมทั้งหมด<b id="grand">฿0.00</b></div>
  <div class="tot">จำนวนลัง<b id="cases" style="font-size:20px;color:var(--ink)">0</b></div>
  <div class="sp"></div>
  <button id="capb" class="pri">📷 โหมดแคปภาพ</button>
  <button id="reset">ล้างทั้งหมด</button>
</div>
<div class="grid" id="grid"></div>

<div class="ov" id="ov"><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><b id="ttl">เลือกสินค้า</b><button id="close">ปิด</button></div>
  <input id="q" placeholder="ค้นหาสินค้า เช่น แม็กนั่ม, คอร์นเนตโต">
  <div class="list" id="list"></div>
</div></div>

const N=15,MAX=2,colors=[0,1,2,3,4];
const fmt=n=>'฿'+n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
let cells=Array.from({length:N},()=>[]);let cur=-1;
const g=document.getElementById('grid');
function imgHtml(p,cls){return p.img?`<img src="${p.img}" alt="">`:`<div class="ph">🍦</div>`}
function render(){
  let grand=0,cs=0;g.innerHTML='';
  cells.forEach((c,i)=>{
    const d=document.createElement('div');d.className='cell';
    d.style.background=`var(--c${[0,1,2,1,0,0,1,2,1,0,0,1,2,1,3][i]})`;
    let sub=c.reduce((s,x)=>s+P[x.id].price*x.qty,0);grand+=sub;cs+=c.reduce((s,x)=>s+x.qty,0);
    let h=`<div class="no"><span>ช่อง ${i+1}</span><span>${c.length}/${MAX}</span></div>`;
    for(let k=0;k<MAX;k++){
      const x=c[k];
      if(x){const p=P[x.id];
        h+=`<div class="slot">${imgHtml(p)}<div class="nm">${p.name}</div><div class="pr">${fmt(p.price)}/ลัง</div>
        <div class="q"><button data-a="m" data-i="${i}" data-k="${k}">−</button><b>${x.qty}</b><button data-a="p" data-i="${i}" data-k="${k}">+</button></div>
        <button class="x" data-a="x" data-i="${i}" data-k="${k}">✕</button></div>`;
      }else h+=`<div class="slot empty">＋ เพิ่มสินค้า</div>`;
    }
    h+=`<div class="sum">${fmt(sub)}</div>`;
    d.innerHTML=h;
    d.onclick=e=>{
      const b=e.target.closest('button');
      if(b){e.stopPropagation();const k=+b.dataset.k,a=b.dataset.a;
        if(a==='x')cells[i].splice(k,1);
        else if(a==='p')cells[i][k].qty++;
        else if(--cells[i][k].qty<1)cells[i].splice(k,1);
        render();return}
      if(document.body.classList.contains('cap'))return;
      if(c.length>=MAX){flash();return}
      openPick(i)};
    g.appendChild(d)});
  document.getElementById('grand').textContent=fmt(grand);
  document.getElementById('cases').textContent=cs;
}
function flash(){const t=document.querySelector('.sub');t.textContent='ช่องนี้เต็มแล้ว (ครบ 2 รายการ) — กด ✕ เพื่อเอาออกก่อน';t.style.color='var(--acc)';
  setTimeout(()=>{t.textContent='แตะที่ช่องเพื่อเพิ่มสินค้า (ช่องละไม่เกิน 2 รายการ) · ราคาคิดเป็นต่อลัง';t.style.color=''},2200)}
const ov=document.getElementById('ov'),list=document.getElementById('list'),q=document.getElementById('q');
function openPick(i){cur=i;document.getElementById('ttl').textContent='เลือกสินค้าใส่ช่อง '+(i+1);q.value='';fill('');ov.classList.add('on')}
function fill(s){
  list.innerHTML='';
  P.filter(p=>p.name.toLowerCase().includes(s.toLowerCase())).forEach(p=>{
    const d=document.createElement('div');d.className='it';
    d.innerHTML=`${imgHtml(p)}<div class="nm">${p.name}</div><div class="pr">${fmt(p.price)}</div>`;
    d.onclick=()=>{const c=cells[cur];if(c.length<MAX){c.push({id:p.id,qty:1})}
      ov.classList.remove('on');render()};
    list.appendChild(d)});
  if(!list.children.length)list.innerHTML='<div class="msg">ไม่พบสินค้า</div>';
}
q.oninput=()=>fill(q.value);
document.getElementById('close').onclick=()=>ov.classList.remove('on');
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('on')};
document.getElementById('reset').onclick=()=>{cells=Array.from({length:N},()=>[]);render()};
document.getElementById('capb').onclick=function(){const on=document.body.classList.toggle('cap');this.textContent=on?'✏️ กลับไปแก้ไข':'📷 โหมดแคปภาพ';window.scrollTo(0,0)};
render();
</script></body></html>
